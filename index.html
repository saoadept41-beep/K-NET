<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-NET • Login</title>

<!-- ВАЖНО: css/auth.css больше не подключается — он был сломан и конфликтовал со стилями ниже -->
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #050510;
  font-family: Arial, sans-serif;
  color: white;
}

#background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top left, rgba(120,0,255,.35), transparent 45%),
    radial-gradient(circle at bottom right, rgba(255,80,200,.25), transparent 45%),
    linear-gradient(135deg, #050510, #0b0f2a);
  animation: bgMove 12s ease-in-out infinite alternate;
}
@keyframes bgMove { to { transform: scale(1.05); } }

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  z-index: 5;
  transition: opacity .6s ease;
}
#logo {
  font-size: 3rem;
  letter-spacing: 6px;
  text-shadow: 0 0 15px cyan, 0 0 35px purple;
}
#ring {
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  border: 1px solid rgba(0,200,255,.35);
  animation: spin 18s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#hint { margin-top: 30px; color: rgba(255,255,255,.6); letter-spacing: 2px; }

#auth-panel {
  display: none;
  position: relative;
  z-index: 10;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
}
#auth-panel.visible { display: flex; }

.auth-card {
  width: 340px;
  max-width: calc(100vw - 40px);
  padding: 35px;
  background: rgba(255,255,255,.05);
  backdrop-filter: blur(25px);
  border-radius: 25px;
  box-shadow: 0 0 40px rgba(0,119,255,.2);
  animation: fadeIn 1s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.auth-logo {
  text-align: center;
  font-size: 28px;
  letter-spacing: 6px;
  margin-bottom: 30px;
  color: #4da3ff;
}

/* ===== ТАБЫ + бегущая линия ===== */
.tabs {
  position: relative;
  display: flex;
  margin-bottom: 25px;
}
.tabs button {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: #6c8db3;
  cursor: pointer;
  transition: color .3s;
}
.tabs button.active { color: #4da3ff; }

.tab-indicator {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 50%;
  height: 2px;
  background: #4da3ff;
  box-shadow: 0 0 10px rgba(77,163,255,.8);
  transition: transform .4s cubic-bezier(.4, 0, .2, 1);
}
.tabs[data-active="register"] .tab-indicator { transform: translateX(100%); }

/* ===== ФОРМЫ + анимация перехода ===== */
.form { display: none; flex-direction: column; }
.form.active { display: flex; animation: formIn .45s cubic-bezier(.4, 0, .2, 1); }
.form.active.from-left { animation-name: formInLeft; }

@keyframes formIn {
  from { opacity: 0; transform: translateX(40px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes formInLeft {
  from { opacity: 0; transform: translateX(-40px); }
  to   { opacity: 1; transform: translateX(0); }
}

.form input {
  width: 100%;
  margin-bottom: 18px;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(0,0,0,.4);
  color: white;
  outline: none;
  transition: .3s;
}
.form input:focus { border-color: #4da3ff; box-shadow: 0 0 15px rgba(0,119,255,.4); }

.form button {
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(90deg, #0077ff, #00c6ff);
  color: white;
  cursor: pointer;
  transition: .3s;
}
.form button:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0,119,255,.6); }

#authMessage {
  margin-top: 15px;
  min-height: 1.2em;
  text-align: center;
  color: #ff6b8a;
}

@media (prefers-reduced-motion: reduce) {
  .form.active, .tab-indicator { animation: none; transition: none; }
}
</style>
</head>

<body>

<div id="background"></div>

<div id="intro">
  <div id="ring"></div>
  <div id="logo">K-NET</div>
  <div id="hint">CLICK TO ENTER</div>
</div>

<div id="auth-panel">
  <div class="auth-card">

    <div class="auth-logo">K-NET</div>

    <div class="tabs" data-active="login">
      <button type="button" class="active" data-tab="login">LOGIN</button>
      <button type="button" data-tab="register">REGISTER</button>
      <span class="tab-indicator"></span>
    </div>

    <form id="loginForm" class="form active">
      <input id="loginEmail" type="email" placeholder="Email" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="registerForm" class="form">
      <input id="regEmail" type="email" placeholder="Email" required>
      <input id="regPassword" type="password" placeholder="Password" required>
      <input id="confirmPassword" type="password" placeholder="Confirm password" required>
      <button type="submit">Create account</button>
    </form>

    <div id="authMessage"></div>

  </div>
</div>

<!-- Вся логика (интро, табы, Firebase) теперь в одном файле -->
<script type="module" src="js/auth.js"></script>

</body>
</html>

</body>
</html>
