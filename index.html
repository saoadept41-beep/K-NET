
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-NET • Login</title>

<link rel="stylesheet" href="css/auth.css">

<style>
html, body {
  margin: 0;
  min-height: 100%;
  background: #050510;
  font-family: Arial, sans-serif;
}

#background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at top left, rgba(120,0,255,.35), transparent 45%),
    radial-gradient(circle at bottom right, rgba(255,80,200,.25), transparent 45%),
    linear-gradient(135deg, #050510, #0b0f2a);
  animation: bgMove 12s ease-in-out infinite alternate;
}

@keyframes bgMove {
  to { transform: scale(1.05); }
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  z-index: 5;
  transition: opacity .6s ease;
}

#logo {
  font-size: 3rem;
  letter-spacing: 6px;
  color: white;
  text-shadow: 0 0 15px cyan, 0 0 35px purple;
}

#ring {
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  border: 1px solid rgba(0,200,255,.35);
  animation: spin 18s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#hint {
  margin-top: 30px;
  color: rgba(255,255,255,.6);
  letter-spacing: 2px;
}

#auth-panel {
  display: none;
  position: relative;
  z-index: 10;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
}

#auth-panel.visible {
  display: flex;
}

.auth-card {
  width: 340px;
  max-width: calc(100vw - 100px);
  padding: 35px;
  background: rgba(255,255,255,.05);
  backdrop-filter: blur(25px);
  border-radius: 25px;
  box-shadow: 0 0 40px rgba(0,119,255,.2);
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.auth-logo {
  text-align: center;
  font-size: 28px;
  letter-spacing: 6px;
  margin-bottom: 30px;
  color: #4da3ff;
}

.tabs {
  display: flex;
  margin-bottom: 25px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: #6c8db3;
  cursor: pointer;
}

.tabs button.active {
  color: #4da3ff;
  border-bottom: 2px solid #4da3ff;
}

.form {
  display: none;
  flex-direction: column;
}

.form.active {
  display: flex;
}

.form input {
  box-sizing: border-box;
  width: 100%;
  margin-bottom: 18px;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(0,0,0,.4);
  color: white;
  outline: none;
}

.form input:focus {
  border-color: #4da3ff;
  box-shadow: 0 0 15px rgba(0,119,255,.4);
}

.form button {
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(90deg,#0077ff,#00c6ff);
  color: white;
  cursor: pointer;
}

#authMessage {
  margin-top: 15px;
  text-align: center;
  color: white;
}
</style>
</head>

<body>

<div id="background"></div>

<div id="intro">
  <div id="ring"></div>
  <div id="logo">K-NET</div>
  <div id="hint">CLICK TO ENTER</div>
</div>

<div id="auth-panel">
  <div class="auth-card">

    <div class="auth-logo">K-NET</div>

    <div class="tabs">
      <button type="button" class="active" data-tab="login">LOGIN</button>
      <button type="button" data-tab="register">REGISTER</button>
    </div>

    <form id="loginForm" class="form active">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="registerForm" class="form">
      <input id="regEmail" type="email" placeholder="Email" required>
      <input id="regPassword" type="password" placeholder="Password" required>
      <input id="confirmPassword" type="password" placeholder="Confirm password" required>
      <button type="submit">Create account</button>
    </form>

    <div id="authMessage"></div>

  </div>
</div>

<script>
const intro = document.getElementById("intro");
const authPanel = document.getElementById("auth-panel");

intro.addEventListener("click", () => {
  intro.style.opacity = "0";

  setTimeout(() => {
    intro.style.display = "none";
    authPanel.classList.add("visible");
  }, 600);
});

// Переключение LOGIN / REGISTER
const tabs = document.querySelectorAll(".tabs button");

tabs.forEach(tab => {
  tab.addEventListener("click", () => {

    tabs.forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".form").forEach(f =>
      f.classList.remove("active")
    );

    tab.classList.add("active");

    document.getElementById(
      tab.dataset.tab + "Form"
    ).classList.add("active");

    document.getElementById("authMessage").textContent = "";
  });
});
</script>

<script type="module" src="js/auth.js"></script>

</body>
</html>
